<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <header class="chat-header">
    <h1>Techup Chatroom</h1>
  </header>

  <main class="chat-container">

    <div class="chat-row row-right">
      <div class="message-bubble bubble-green">
        สวัสดีจ้า
      </div>
    </div>

    <div class="chat-row row-right">
      <div class="message-bubble bubble-light-gray has-close">
        Coding สนุกจังเลย
        <button class="btn-close">&times;</button>
      </div>
    </div>

    <div class="chat-row row-right">
      <div class="message-bubble bubble-green">
        👩‍💻 😍
      </div>
    </div>

    <div class="chat-row row-left">
      <div class="message-bubble bubble-dark-gray">
        😍
      </div>
    </div>

    <div class="chat-row row-left">
      <div class="message-bubble bubble-dark-gray">
        🥳
      </div>
    </div>

  </main>
</body>

</html>
