<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <!-- Start coding here -->
  <div class="header">
    <h1>Techup Chatroom</h1>
  </div>
  
  <div class="chatroom">
    <!-- Left side messages (gray) -->
    <div class="message-row left">
      <div class="message-box gray">
        <p>Hello!</p>
      </div>
    </div>
    
    <div class="message-row left">
      <div class="message-box gray">
        <p>How are you?</p>
      </div>
    </div>
    
    <!-- Right side messages (green) -->
    <div class="message-row right">
      <div class="message-box green">
        <p>Hi there!</p>
        <div class="tail"></div>
      </div>
    </div>
    
    <!-- Message with close button -->
    <div class="message-row left">
      <div class="message-box gray with-close">
        <p>Cảng đặt bàn</p>
        <button class="close-btn">✕</button>
      </div>
    </div>
    
    <!-- Right side message with icons -->
    <div class="message-row right">
      <div class="message-box green">
        <p>😊 ⭐</p>
        <div class="tail"></div>
      </div>
    </div>
  </div>
</body>

</html>
